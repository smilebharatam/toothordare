    fill="none" 
    stroke="url(#gold-grad)" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Graceful Left Sweeping Ribbon & Intertwined Teardrop Loop -->
  <path 
    d="M 34 218 
       C 75 204, 130 205, 185 234 
       C 150 262, 135 298, 140 338 
       C 144 372, 168 396, 188 375 
       C 204 358, 206 322, 192 290 
       C 178 260, 160 236, 138 214" 
    fill="none" 
    stroke="url(#gold-grad)" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
